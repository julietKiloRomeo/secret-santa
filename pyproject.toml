 [project]
 name = "secret-santa"
 version = "0.1.0"
 description = "Lightweight Secret Santa web app"
 readme = "README.md"
 authors = [{ name = "jkr", email = "jimmy.kjaersgaard@gmail.com" }]
 requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.162.0",
  "itsdangerous>=2.2.0",
  "jinja2>=3.1.6",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0",
  "uvicorn>=0.54.0",
  "werkzeug>=3.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.14.0",
    "pillow>=12.3.0",
    "pytest>=9.0.1",
    "ruff>=0.17.3",
]

[tool.hatch.build.targets.wheel]
include = [
  "secret_santa.py",
  "app.py",
  "couples.yaml",
  "previous.yaml",
  "templates/**",
  "static/**",
  "README.md",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
