{% extends 'base.html' %}
{% block title %}High Scores{% endblock %}
{% block content %}
  <section class="xmas-card">
    <header class="text-center">
      <p class="text-sm uppercase tracking-widest text-gold-300/80">Julens rekorder</p>
      <h1 class="mt-1 text-4xl">High Scores</h1>
      <p class="mt-2 text-snow-100/80">Top 10 for hvert spil. Brug pilene for at skifte spil.</p>
    </header>

    <nav class="mt-6 flex items-center justify-between gap-2">
      <button id="hs-prev" aria-label="Forrige spil" class="btn-gold h-11 w-11 !px-0 text-xl">‹</button>
      <div class="text-center">
        <div id="hs-game-label" class="font-display text-2xl text-gold-300">Henter…</div>
        <button id="hs-home" class="mt-1 text-xs text-snow-100/70 underline hover:text-gold-300">Tilbage til spil</button>
      </div>
      <button id="hs-next" aria-label="Næste spil" class="btn-gold h-11 w-11 !px-0 text-xl">›</button>
    </nav>

    <ol id="hs-list" class="mt-6 space-y-2"></ol>
    <div id="hs-status" class="mt-4 hidden rounded-2xl border border-cranberry-500/60 bg-cranberry-700/40 p-3 text-sm"></div>
  </section>
  <script>
    (function () {
      const games = {{ games|tojson }};
      let idx = 0;
      const listEl = document.getElementById('hs-list');
      const labelEl = document.getElementById('hs-game-label');
      const statusEl = document.getElementById('hs-status');
      const prevBtn = document.getElementById('hs-prev');
      const nextBtn = document.getElementById('hs-next');
      const homeBtn = document.getElementById('hs-home');

      function renderScores(scores) {
        listEl.innerHTML = '';
        if (!scores || !scores.length) {
          const li = document.createElement('li');
          li.className = 'text-snow-100/70'; li.textContent = 'Ingen scores endnu. Bliv den første!';
          listEl.appendChild(li);
          return;
        }
        scores.slice(0, 10).forEach((entry, i) => {
          const li = document.createElement('li');
          li.className = 'flex items-center justify-between rounded-2xl border border-gold-500/20 bg-pine-950/60 px-4 py-3';
          const left = document.createElement('div');
          left.className = 'flex items-center gap-2';
          const rank = document.createElement('span');
          rank.className = 'w-7 font-display text-xl text-gold-300';
          rank.textContent = i + 1;
          const name = document.createElement('span');
          name.textContent = entry.name;
          left.append(rank, name);
          const pts = document.createElement('span');
          pts.className = 'font-mono text-lg text-snow-50';
          pts.textContent = entry.score;
          li.append(left, pts);
          listEl.appendChild(li);
        });
      }

      async function loadScores() {
        const [gameId, label] = games[idx] || games[0];
        labelEl.textContent = label || gameId;
        statusEl.classList.add('hidden');
        listEl.innerHTML = '<li class="text-sm text-snow-100/70">Henter scores…</li>';
        try {
          const resp = await fetch(`/api/scores/${gameId}`);
          if (!resp.ok) throw new Error(`Status ${resp.status}`);
          const data = await resp.json();
          renderScores(data.scores || []);
        } catch (err) {
          statusEl.textContent = 'Kunne ikke hente scores.';
          statusEl.classList.remove('hidden');
          console.error(err);
        }
      }

      function clampIdx() {
        if (idx < 0) idx = games.length - 1;
        if (idx >= games.length) idx = 0;
      }

      prevBtn?.addEventListener('click', () => {
        idx -= 1;
        clampIdx();
        loadScores();
      });
      nextBtn?.addEventListener('click', () => {
        idx += 1;
        clampIdx();
        loadScores();
      });
      homeBtn?.addEventListener('click', () => {
        window.location.href = '/spil';
      });

      loadScores();
    })();
  </script>
{% endblock %}
