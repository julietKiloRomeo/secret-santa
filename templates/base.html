<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#06201a" />
  <title>{% block title %}Secret Santa{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version }}" />
  <style>
    #locked-toast { position: fixed; top: 72px; left: 50%; transform: translateX(-50%); z-index: 2000; transition: opacity .4s ease; }
  </style>
</head>
<body class="{% block body_class %}{% endblock %}" {% block body_attrs %}{% endblock %}>
  <nav class="fixed inset-x-0 top-0 z-50 border-b border-gold-500/30 bg-pine-950/90 backdrop-blur" style="padding-top:env(safe-area-inset-top,0px)">
    <div class="mx-auto flex h-14 max-w-6xl items-center justify-between px-4" style="padding-left:max(1rem,env(safe-area-inset-left));padding-right:max(1rem,env(safe-area-inset-right))">
      <a href="/" class="font-display text-xl text-gold-300">🎄 Secret Santa</a>
      {% if session.get('user') %}
      <div class="hidden items-center gap-5 text-sm md:flex">
        <a href="/lodtraekning" class="hover:text-gold-300">Lodtrækning</a>
        <a href="/spil" class="hover:text-gold-300">Spil</a>
        <a href="/high-scores" class="hover:text-gold-300">High Scores</a>
        <a href="/profil" class="hover:text-gold-300">Min profil</a>
        {% if is_admin_user() %}<a id="admin-link" href="/admin" class="hover:text-gold-300">Admin</a>{% endif %}
      </div>
      <button id="nav-toggle" aria-label="Åbn menu" aria-controls="mobile-menu" aria-expanded="false" class="p-2 text-2xl md:hidden">☰</button>
      {% endif %}
    </div>
    {% if session.get('user') %}
    <div id="mobile-menu" class="hidden border-t border-gold-500/20 bg-pine-950 px-4 py-3 md:hidden">
      <a href="/lodtraekning" class="block py-2">Lodtrækning</a>
      <a href="/spil" class="block py-2">Spil</a>
      <a href="/high-scores" class="block py-2">High Scores</a>
      <a href="/profil" class="block py-2">Min profil</a>
      {% if is_admin_user() %}<a id="admin-link" href="/admin" class="block py-2">Admin</a>{% endif %}
    </div>
    {% endif %}
  </nav>

  <main class="px-4 pb-24 pt-20" style="padding-top:calc(5rem + env(safe-area-inset-top,0px))">
    <div class="mx-auto max-w-3xl">
      {% block content %}{% endblock %}
    </div>
  </main>

  <script>
    // Intercept clicks on disabled game links and show a friendly message
    document.addEventListener('click', function (ev) {
      const a = ev.target.closest && ev.target.closest('a[data-disabled="1"]');
      if (a) {
        ev.preventDefault();
        const msg = 'Hov hov. Den låge må du ikke åbne endnu!';
        let t = document.getElementById('locked-toast');
        if (!t) {
          t = document.createElement('div');
          t.id = 'locked-toast';
          document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = 1;
        clearTimeout(t._timeout);
        t._timeout = setTimeout(() => {
          t.style.opacity = 0;
        }, 2200);
      }
    });

    // Mobile menu toggle; Escape closes it and returns focus to the button
    const toggle = document.getElementById('nav-toggle');
    if (toggle) {
      const menu = document.getElementById('mobile-menu');
      const setOpen = (open) => {
        menu.classList.toggle('hidden', !open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      };
      toggle.addEventListener('click', () => setOpen(menu.classList.contains('hidden')));
      document.addEventListener('keydown', (ev) => {
        if (ev.key === 'Escape' && !menu.classList.contains('hidden')) {
          setOpen(false);
          toggle.focus();
        }
      });
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js').catch((err) => {
        console.warn('SW registration failed', err);
      });
    }
  </script>
</body>
</html>
