{% extends 'base.html' %}
{% block title %}Tredje Advent{% endblock %}
{% block content %}
  <style>
    #jingle-bell-hero-root,
    #jingle-bell-hero-root * {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-drag: none;
    }
  </style>
  <div class="max-w-6xl mx-auto p-4 sm:p-6">
    <h1 class="sr-only">Jingle Bell Hero</h1>
    <div
      id="jingle-bell-hero-root"
      class="mx-auto w-full max-w-[800px] aspect-[800/820] rounded-3xl border border-white/10 bg-slate-950 shadow-2xl overflow-hidden"
    >
    </div>
  </div>
  <a
    href="/"
    class="fixed left-3 top-3 sm:left-4 sm:top-auto sm:bottom-4 z-50 inline-flex items-center gap-2 rounded-full bg-white/15 px-4 py-2 text-sm font-semibold text-white shadow-lg backdrop-blur border border-white/20 hover:bg-white/25"
    style="padding-bottom: env(safe-area-inset-bottom, 0px);"
  >
    ← Til forsiden
  </a>

  <script src="/static/vendor/phaser-4.2.1.min.js"></script>
  <script type="module" src="/static/jingle_bell_hero.js"></script>
{% endblock %}
