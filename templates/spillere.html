{% extends 'base.html' %}
{% block title %}Spillere{% endblock %}
{% block content %}
  <section class="xmas-card" data-player="{{ player }}">
    <header class="text-center">
      <p class="text-sm uppercase tracking-widest text-gold-300/80">Julens spillere</p>
      <h1 class="mt-1 text-4xl">Spillere</h1>
    </header>
    <div id="player-cards" class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3" aria-live="polite">
      <p id="players-status" class="text-snow-100/80">Henter…</p>
    </div>
  </section>

  <dialog id="player-modal" class="xmas-card max-w-lg w-full" aria-labelledby="player-modal-title">
    <div class="flex flex-col gap-4">
      <div class="flex items-center justify-between gap-2">
        <h2 id="player-modal-title" class="text-2xl"></h2>
        <button type="button" data-modal-close class="btn-gold !px-3 !py-1 text-sm">Luk</button>
      </div>
      <div role="tablist" aria-label="Detaljer" class="flex gap-2">
        <button type="button" role="tab" id="tab-badges" aria-controls="panel-badges" aria-selected="true" data-tab="badges" class="btn-gold !px-3 !py-1 text-sm">Badges</button>
        <button type="button" role="tab" id="tab-wish" aria-controls="panel-wish" aria-selected="false" data-tab="wish" tabindex="-1" class="btn-gold !px-3 !py-1 text-sm">Ønskeliste</button>
      </div>
      <div id="panel-badges" role="tabpanel" aria-labelledby="tab-badges" data-panel="badges" class="flex flex-wrap gap-3 [&[hidden]]:hidden"></div>
      <div id="panel-wish" role="tabpanel" aria-labelledby="tab-wish" data-panel="wish" class="text-sm text-snow-100/90" hidden></div>
    </div>
  </dialog>

  <script>
    (function () {
      const me = {{ player|tojson }};
      const root = document.getElementById('player-cards');
      const modal = document.getElementById('player-modal');
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const players = {};
      let lastCard = null;
      let badgeGroupId = 0;

      function badgesFor(badges) {
        if (!badges.length) return '<p class="text-xs text-snow-100/60">Ingen badges endnu</p>';
        const detailId = `badge-detail-${++badgeGroupId}`;
        return `<div class="badge-collection" data-badge-group>
          <div class="badge-row">${badges.map((b) => `
            <button type="button" class="badge-button" data-badge="${esc(b.id)}"
              data-name="${esc(b.name)}" data-snark="${esc(b.snark)}" data-reward="${esc(b.reward)}"
              aria-controls="${detailId}" aria-expanded="false">
              <img src="${esc(b.image)}" alt="" class="rounded-full object-cover">
              <span>${esc(b.name)}</span>
            </button>`).join('')}
          </div>
          <section id="${detailId}" class="badge-detail" data-badge-detail hidden>
            <h3 data-detail-name></h3><p data-detail-snark></p><p data-detail-reward></p>
          </section>
        </div>`;
      }

      function card(p) {
        players[p.name] = p;
        const avatar = p.avatar
          ? `<img src="${esc(p.avatar)}" alt="" class="h-20 w-20 rounded-full border border-gold-500/40 object-cover">`
          : `<div class="flex h-20 w-20 items-center justify-center rounded-full border border-gold-500/40 bg-pine-950/60 font-display text-2xl text-gold-300">${esc(p.name[0].toUpperCase())}</div>`;
        const badges = badgesFor(p.badges);
        return `
          <article class="xmas-card flex flex-col gap-3 ${p.name === me ? 'ring-2 ring-gold-300/60' : ''}" data-card="${esc(p.name)}">
            <button type="button" data-card-open="${esc(p.name)}" class="flex items-center gap-3 rounded-xl text-left focus-visible:outline focus-visible:outline-2 focus-visible:outline-gold-300"
                    aria-haspopup="dialog" aria-label="Vis ${esc(p.name)}">
              ${avatar}
              <h2 class="text-2xl">${esc(p.name)}</h2>
            </button>
            ${badges}
          </article>`;
      }

      function selectTab(name, focus) {
        document.querySelectorAll('[role="tab"]').forEach((t) => {
          const on = t.dataset.tab === name;
          t.setAttribute('aria-selected', on ? 'true' : 'false');
          t.tabIndex = on ? 0 : -1;
          if (on && focus) t.focus();
        });
        document.querySelectorAll('[role="tabpanel"]').forEach((p) => { p.hidden = p.dataset.panel !== name; });
      }

      function openPlayer(name, card) {
        const p = players[name];
        if (!p) return;
        lastCard = card || null;
        document.getElementById('player-modal-title').textContent = p.name;
        const wishEl = document.querySelector('[data-panel="wish"]');
        // The wish list is HTML the server already sanitized on read.
        wishEl.innerHTML = p.wish_html || '<p class="text-snow-100/60">Ingen ønsker endnu.</p>';
        document.querySelector('[data-panel="badges"]').innerHTML = badgesFor(p.badges);
        selectTab('badges', false);
        modal.showModal();
      }

      root.addEventListener('click', (ev) => {
        const btn = ev.target.closest('[data-card-open]');
        if (btn) openPlayer(btn.dataset.cardOpen, btn);
      });

      function showBadge(group, button) {
        const detail = group.querySelector('[data-badge-detail]');
        group.querySelectorAll('[data-badge]').forEach((b) => b.setAttribute('aria-expanded', b === button ? 'true' : 'false'));
        detail.hidden = !button;
        if (!button) return;
        detail.querySelector('[data-detail-name]').textContent = button.dataset.name;
        detail.querySelector('[data-detail-snark]').textContent = button.dataset.snark;
        detail.querySelector('[data-detail-reward]').textContent = button.dataset.reward;
      }

      document.addEventListener('click', (ev) => {
        const button = ev.target.closest('[data-badge]');
        if (!button) return;
        const group = button.closest('[data-badge-group]');
        group.pinnedBadge = group.pinnedBadge === button ? null : button;
        showBadge(group, group.pinnedBadge);
      });
      document.addEventListener('pointerover', (ev) => {
        if (ev.pointerType !== 'mouse') return;
        const button = ev.target.closest('[data-badge]');
        if (!button || button.contains(ev.relatedTarget)) return;
        const group = button.closest('[data-badge-group]');
        if (!group.pinnedBadge) showBadge(group, button);
      });
      document.addEventListener('pointerout', (ev) => {
        if (ev.pointerType !== 'mouse') return;
        const group = ev.target.closest('[data-badge-group]');
        if (!group || group.contains(ev.relatedTarget)) return;
        if (!group.pinnedBadge) showBadge(group, null);
      });
      document.addEventListener('keydown', (ev) => {
        if (ev.key !== 'Escape') return;
        const active = modal.open ? modal : root;
        const focused = document.activeElement?.closest('[data-badge-group]');
        const group = (focused && !focused.querySelector('[data-badge-detail]').hidden && focused) ||
          [...active.querySelectorAll('[data-badge-group]')]
          .find((g) => !g.querySelector('[data-badge-detail]').hidden);
        if (!group || group.querySelector('[data-badge-detail]').hidden) return;
        ev.preventDefault();
        group.pinnedBadge = null;
        showBadge(group, null);
      });
      modal.querySelector('[data-modal-close]').addEventListener('click', () => modal.close());
      modal.addEventListener('close', () => { if (lastCard) lastCard.focus(); lastCard = null; });

      // Tabs: click, or arrow keys between them.
      const tabs = [...document.querySelectorAll('[role="tab"]')];
      tabs.forEach((t) => t.addEventListener('click', () => selectTab(t.dataset.tab, true)));
      document.querySelector('[role="tablist"]').addEventListener('keydown', (ev) => {
        if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
        const i = tabs.indexOf(document.activeElement);
        if (i < 0) return;
        const next = tabs[(i + (ev.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
        selectTab(next.dataset.tab, true);
      });

      fetch('/api/players', { credentials: 'same-origin' })
        .then((r) => r.json())
        .then((data) => {
          root.innerHTML = data.players.map(card).join('');
        })
        .catch(() => { root.innerHTML = '<p class="text-cranberry-500">Kunne ikke hente spillerne.</p>'; });
    })();
  </script>
{% endblock %}
